[project]
name = "finance-hub-backend"
version = "0.1.0"
description = "Finance Hub Pessoal — API privada single-user"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E402"]
# B008: Depends/Query em defaults é o padrão do FastAPI.
ignore = ["B008", "RUF012", "C408"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001"]
"tests/conftest.py" = ["E402"]
